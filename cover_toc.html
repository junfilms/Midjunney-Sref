<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #fff;
        font-family: 'Arial', sans-serif;
        overflow: hidden;
        position: relative;
      }
      .content-container {
        padding: 40px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .title {
        font-size: 64px;
        font-weight: bold;
        margin-bottom: 20px;
        text-align: center;
        background: linear-gradient(90deg, #ff6b6b, #a685e2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .logo-container {
        display: flex;
        justify-content: center;
        margin: 30px 0;
      }
      .logo {
        width: 200px;
        height: auto;
      }
      .categories {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        margin-top: 40px;
      }
      .category {
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 15px 30px;
        font-size: 24px;
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
        text-decoration: none;
        color: #fff;
        display: inline-block;
      }
      .category:hover {
        transform: translateY(-5px);
        background-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }
      .navigation {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
      }
      .nav-button {
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        padding: 8px 15px;
        color: #fff;
        text-decoration: none;
        transition: all 0.3s ease;
      }
      .nav-button:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="slide-container">
      <div class="content-container">
        <h1 class="title">미드저니 Sref 모음</h1>
        
        <div class="logo-container">
          <img src="midjourney_logo.png" alt="Midjourney Logo" class="logo">
        </div>
        
        <div class="categories">
          <a href="anime_page1.html" class="category">애니</a>
          <a href="real_page1.html" class="category">실사</a>
          <a href="sf_page1.html" class="category">SF</a>
          <a href="fantasy_page1.html" class="category">판타지</a>
          <a href="noir_page1.html" class="category">느와르/스릴러</a>
          <a href="etc_page1.html" class="category">기타</a>
        </div>
        
        <div class="navigation">
          <a href="index.html" class="nav-button">홈으로</a>
          <a href="anime_page1.html" class="nav-button">다음</a>
        </div>
      </div>
    </div>
  </body>
</html>
