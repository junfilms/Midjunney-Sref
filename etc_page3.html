<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: #fff;
        font-family: 'Arial', sans-serif;
        overflow: hidden;
      }
      .content-container {
        padding: 30px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .title {
        font-size: 36px;
        font-weight: bold;
        background: linear-gradient(90deg, #ff6b6b, #a685e2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .category-badge {
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 5px 15px;
        font-size: 18px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .text-input {
        color: #ffffff; /* 텍스트 입력 박스 글자색 흰색으로 변경 */
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
        min-height: 120px;
        font-size: 16px;
        resize: none;
        width: 100%;
      }
      .image-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      .image-card {
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .image-container {
        width: 100%;
        height: 200px;
        background-color: #2a2a4a;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .image-placeholder {
        color: rgba(255, 255, 255, 0.3);
        font-size: 14px;
        text-align: center;
      }
      .code-input {
      /* placeholder 스타일 추가 */
      .code-input::placeholder {
        color: rgba(255, 255, 255, 0.3);
        opacity: 1;
      }
      /* 포커스 시 placeholder 숨김 */
      .code-input:focus::placeholder {
        opacity: 0;
        transition: opacity 0.3s;
      }
        color: #ffff00; /* 코드 입력 필드 글자색 노란색으로 변경 */
        background-color: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0 0 10px 10px;
        padding: 10px;
        font-family: monospace;
        font-size: 14px;
        color: #a0a0a0;
        width: 100%;
        height: 40px;
      }
    </style>
    <script>
      // 페이지 로드 후 코드 입력 필드에 이벤트 리스너 추가
      window.addEventListener('DOMContentLoaded', function() {
        const codeInputs = document.querySelectorAll('.code-input');
        codeInputs.forEach(input => {
          // 포커스 시 placeholder 텍스트 제거
          input.addEventListener('focus', function() {
            this.setAttribute('data-placeholder', this.getAttribute('placeholder'));
            this.setAttribute('placeholder', '');
          });
          
          // 포커스 아웃 시 값이 없으면 placeholder 복원
          input.addEventListener('blur', function() {
            if (!this.value) {
              this.setAttribute('placeholder', this.getAttribute('data-placeholder'));
            }
          });
          
          // 입력 시 placeholder 제거
          input.addEventListener('input', function() {
            if (this.value) {
              this.setAttribute('placeholder', '');
            } else {
              this.setAttribute('placeholder', this.getAttribute('data-placeholder'));
            }
          });
        });
      });
    </script>
  </head>
  <body>
    <div class="slide-container">
      <div class="content-container">
        <div class="header">
          <h1 class="title">미드저니 Sref 모음</h1>
          <div class="category-badge">기타 - 페이지 3</div>
        </div>
        
        <textarea class="text-input" placeholder="여기에 3~4줄 정도의 문장을 입력하세요..."></textarea>
        
        <div class="image-grid">
          <!-- 이미지 카드 1 -->
          <div class="image-card">
            <div class="image-container">
              <div class="image-placeholder">
                <i class="fas fa-image fa-3x mb-2"></i><br>
                이미지를 여기에 드래그하거나 붙여넣기 하세요
              </div>
            </div>
            <input type="text" class="code-input" placeholder="코드를 입력하세요...">
          </div>
          
          <!-- 이미지 카드 2 -->
          <div class="image-card">
            <div class="image-container">
              <div class="image-placeholder">
                <i class="fas fa-image fa-3x mb-2"></i><br>
                이미지를 여기에 드래그하거나 붙여넣기 하세요
              </div>
            </div>
            <input type="text" class="code-input" placeholder="코드를 입력하세요...">
          </div>
          
          <!-- 이미지 카드 3 -->
          <div class="image-card">
            <div class="image-container">
              <div class="image-placeholder">
                <i class="fas fa-image fa-3x mb-2"></i><br>
                이미지를 여기에 드래그하거나 붙여넣기 하세요
              </div>
            </div>
            <input type="text" class="code-input" placeholder="코드를 입력하세요...">
          </div>
          
          <!-- 이미지 카드 4 -->
          <div class="image-card">
            <div class="image-container">
              <div class="image-placeholder">
                <i class="fas fa-image fa-3x mb-2"></i><br>
                이미지를 여기에 드래그하거나 붙여넣기 하세요
              </div>
            </div>
            <input type="text" class="code-input" placeholder="코드를 입력하세요...">
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
